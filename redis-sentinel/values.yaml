---
redisSentinel:
  name: "redis-sentinel"
  clusterSize: 3
  image: docker.io/ruo91/opstree-redis-sentinel-fedora
  tag: v8.10.1
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
    # - name:  Secret with Registry credentials
  redisSecret:
    secretName: ""
    secretKey: ""
    #secretName: "redis-secret"
    #secretKey: "password"
  serviceType: ClusterIP
  resources: {}
    #requests:
    #  cpu: 1
    #  memory: 1Gi
    #limits:
    #  cpu: 1
    #  memory: 1Gi
  ignoreAnnotations: []
    # - "redis.opstreelabs.in/ignore"
  minReadySeconds: 0
  # -- Some fields of statefulset are immutable, such as volumeClaimTemplates.
  # When set to true, the operator will delete the statefulset and recreate it. Default is false.
  recreateStatefulSetOnUpdateInvalid: false
  persistentVolumeClaimRetentionPolicy: {}
    # whenDeleted: Delete
    # whenScaled: Retain

  # Enable or disable Multus CNI attachment for Redis Pods.
  # When set to true, an additional network interface (net1) will be attached to each Pod.
  multus:
    enabled: false

    # Name of the Multus NetworkAttachmentDefinition (NAD) to use.
    # This must match an existing NAD in the same namespace.
    # Only applied when 'enabled' is set to true.
    name: redis-sentinel-ipvlan-l2

# Overwite name for resources
# name: ""

labels: {}
#   foo: bar
#   test: echo

annotations: {}
#   annotation-key: "annotation-value"
#   prometheus.io/scrape: "true"

redisSentinelConfig:
  redisReplicationName: "redis-replication"
  redisReplicationPassword:
    secretName: ""
    secretKey: ""
    #secretName: "redis-secret"
    #secretKey: "password"
  masterGroupName: "redis"
  resolveHostnames: "no"
  announceHostnames: "no"
  redisPort: "6379"
  quorum: "2"
  parallelSyncs: "1"
  failoverTimeout: "180000"
  downAfterMilliseconds: "180000"

externalConfig:
  enabled: true
  data: |
    #### Connectio Management ####
    # Disable protected mode. DANGEROUS on a public interface.
    # Only use this when Redis is bound to private networks and/or ACL+AUTH is enforced.
    protected-mode no

    # Maximum number of client connections. Requires matching OS fd/ulimit tuning.
    # Very high values also require sufficient memory for client state.
    maxclients 50000

    # Listen backlog for pending TCP connection (subject to /proc/sys/net/core/somaxconn).
    tcp-backlog 1048576

    # Client idle timeout in seconds; 0 = never idsconnect idle clients.
    timeout 0

    # TCP keepalive interval in seconds. Helps detect dead peers/NAT drops.
    tcp-keepalive 300

    #### General Logging ####
    # Specify the server verbosity level.
    # 'notice' is moderately verbose and is the recommended level for production environments.
    loglevel notice

    # Specify the log file name. 
    # An empty string ("") forces Redis to log to the standard output (stdout).
    # This is the recommended Cloud-Native approach, allowing OpenShift's logging stack 
    # (e.g., Fluentd, Vector) to asynchronously collect logs without causing disk I/O bottlenecks.
    logfile ""

    #### Announce IP/Port (for replicas behind NAT) ####
    # use these when the master must connect back to a  replica that is not directly reachable.
    #sentinel announce-ip 192.168.0.100
    #sentinel announce-port 30012

    #### Memory Usage & Eviction ####
    # Hard cap for Redis memory. Includes data + overhead + client buffers.
    maxmemory 1gb

    # Evict any key (volatile or not) using LRU when memory is full.
    maxmemory-policy allkeys-lru

    # Number of samples checked by LRU/LFU/TTL algorithms (higher = better accuracy, more CPU).
    maxmemory-samples 5

    #### Performance / Timing ####
    # Server cron frequency (1..500). Higher reduces latency of periodic tasks but increases CPU.
    hz 100

    # Dynamically scale internal frequency based on load (uses 'hz' as the upper bound).
    # Redis 8 defaults to 'yes'. Uncommect to be explicit.
    dynamic-hz yes

    #### Latency tuning & Slow Log ####
    # Record operations taking >= 5 ms for analysis with LATENCY commands.
    latency-monitor-threshold 5

    # Log commands slower than 15 ms to the slowlog.
    slowlog-log-slower-than 15000
    # ...keeping up to 1024 entries (oldest evicted).
    slowlog-max-len 1024

    #### Append Only File (AOF) / RDB durability ####
    # Fsync AOF once per second (balance durability and throughput; up to ~1s data loss on crash).
    appendfsync everysec

    # Start AOF with an RDB preamble for faster restarts.
    aof-use-rdb-preamble yes

    # On startup, accept truncated AOF by discarding the corrupted tail.
    aof-load-truncated yes

    # Incremental fsync during AOF rewrite to smooth I/O.
    aof-rewrite-incremental-fsync yes

    # Incremental fsync during RDB saves to reduce latency spikes.
    rdb-save-incremental-fsync yes

    # Trigger automatic AOF rewrite when file size doubled since last rewrite...
    auto-aof-rewrite-percentage 100
    # ...and only if the file is at least 128 MB.
    auto-aof-rewrite-min-size 128mb

    #### Client Output Buffer limits ####
    # Format: <class> <hard> <soft> <soft-seconds>
    # > hard -> immediate disconnect
    # > soft for soft-seconds -> disconnect

    # Replicas: generous to avoid link breaks during bursts (uses RAM).
    client-output-buffer-limit replica 1024mb 512mb 120

    # Deprecated alias for backward compatibility (same as 'replica').
    client-output-buffer-limit slave 1024mb 512mb 120

    # Normal clients: balanced limits for spikes vs memory usage.
    client-output-buffer-limit normal 256mb 128mb 120

    # Pub/Sub clients: tighter limits to prevent fan-out blowups.
    client-output-buffer-limit pubsub 256mb 64mb 60

    #### Replication robustness ####
    # Ring buffer for partial resync (PSYNC). Larger values tolerate longer outages.
    repl-backlog-size 1gb

    # Keep backlog this many seconds after the last replica disconnects.
    repl-backlog-ttl 3600

    # I/O timeout for master/replica links (seconds) before marking broken.
    repl-timeout 120

    # Master pings replicas every N seconds (keepalive + lag measurement).
    repl-ping-replica-period 10

    # Send snapshot directly over the socket (no on-disk temp file) for full syncs.
    repl-diskless-sync yes

    # When diskless, wait N seconds to gather more replicas before starting bulk transfer.
    repl-diskless-sync-delay 5

    #### Memory Optimization for Data Structures (Redis 8 Standard) ####
    # Use highly memory-efficient listpack encoding for Hashes containing up to 1024 fields.
    hash-max-listpack-entries 1024

    # The maximum size (in bytes) of a single field/value to remain in listpack encoding.
    # Exceeding this threshold will convert the Hash to a standard hashtable.
    hash-max-listpack-value 256

    #### Asynchronous freeing & defragmentation ####
    # Evict keys lazily in background threads (reduces main-thread pauses during eviction).
    lazyfree-lazy-eviction yes

    # Free expired keys asynchronously instead of during the expiry path.
    lazyfree-lazy-expire yes

    # Perform DEL for complex objects in background threads (non-blocking deletes).
    lazyfree-lazy-server-del yes

    # Actively defragment memory to combat long-running fragmentation and stabilize RSS.
    activedefrag yes

    #### I/O Multi-Threading & CPU Affinity (Ultra-Low Latency Core) ####
    # Number of dedicated I/O threads.
    # In a 4-core setup, we allocate 2 threads for I/O, leaving 1 for Main and 1 for BIO.
    #io-threads 2
    #io-threads-do-reads yes

    # CPU Pinning: Lock the main event-loop thread exclusively to Core 0.
    # This guarantees 100% L1/L2 cache locality and eliminates context-switching jitter.
    #server-cpulist 0

    # CPU Pinning: Assign the 2 network I/O threads to Cores 1 and 2.
    # This offloads socket reads and protocol parsing without stealing CPU cycles from the main thread.
    #io-threads-cpulist 1-2

    # CPU Pinning: Isolate frequent background I/O tasks (fsync, lazy free) to Core 3.
    #bio-cpulist 3

    # CPU Pinning: Isolate heavy AOF rewrite child processes to Core 3.
    #aof-rewrite-cpulist 3

    # CPU Pinning: Isolate heavy RDB snapshot (COW) child processes to Core 3.
    # Since BGSAVE and AOF rewrites do not run simultaneously, they can safely share Core 3
    # along with the BIO threads, completely isolating the main thread (Core 0) from any disk I/O.
    #bgsave-cpulist 3

externalService:
  enabled: false
  # annotations:
  #   foo: bar
  serviceType: NodePort
  port: 6379
  nodePort: 30011

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # -- Namespace where servicemonitor resource will be created, if empty it will be created in the same namespace as the redis-sentinel
  namespace: ""
  # -- extraLabels are added to the servicemonitor when enabled set to true
  extraLabels: {}
    # foo: bar
    # team: devops

redisExporter:
  enabled: true
  image: docker.io/ruo91/opstree-redis-exporter-fedora
  tag: "v1.90.0"
  imagePullPolicy: IfNotPresent
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
  env: []
    # - name: VAR_NAME
    #   value: "value1"
  securityContext: {}

initContainer:
  enabled: false
  image: ""
  imagePullPolicy: "IfNotPresent"
  resources: {}
    # requests:
    #   memory: "64Mi"
    #   cpu: "250m"
    # limits:
    #   memory: "128Mi"
    #   cpu: "500m"
  env: []
  command: []
  args: []

sidecars: []
  # - name: "redis-tools"
  #   image: "docker.io/ruo91/opstree-redis-tools-fedora:v8.10.1"
  #   imagePullPolicy: "IfNotPresent"
  #   resources:
  #     limits:
  #       cpu: "100m"
  #       memory: "128Mi"
  #     requests:
  #       cpu: "50m"
  #       memory: "64Mi"
  #   env: []
  #   # - name: MY_ENV_VAR
  #   #   value: "my-env-var-value"
  #   command: []
  #   # - "/bin/sh"
  #   # - "-c"
  #   # - "sleep 3600"

priorityClassName: ""

nodeSelector:
  node-role.kubernetes.io/worker: ""

podSecurityContext:
  #runAsUser: 1000
  #fsGroup: 1000
  runAsUser: 0
  fsGroup: 0
  sysctls:
  - name: net.ipv4.tcp_congestion_control
    value: "bbr"
  - name: net.core.somaxconn
    value: "1048576"
  - name: net.ipv4.tcp_max_syn_backlog
    value: "1048576"
  - name: net.ipv4.ip_nonlocal_bind
    value: "1"
  - name: net.ipv4.tcp_tw_reuse
    value: "1"
  - name: net.ipv4.tcp_fin_timeout
    value: "15"
  - name: net.ipv4.tcp_keepalive_time
    value: "600"
  - name: net.ipv4.tcp_keepalive_probes
    value: "3"
  - name: net.ipv4.tcp_keepalive_intvl
    value: "15"
  - name: net.ipv4.tcp_syncookies
    value: "1"
  - name: net.ipv4.tcp_syn_retries
    value: "3"
  - name: net.ipv4.tcp_slow_start_after_idle
    value: "0"
  - name: net.ipv4.tcp_fastopen
    value: "3"
  - name: net.ipv4.tcp_sack
    value: "1"
  - name: net.ipv4.tcp_mtu_probing
    value: "1"
  - name: net.ipv4.tcp_timestamps
    value: "1"

#securityContext: {}
securityContext:
  privileged: true

#affinity: {}
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/worker
          operator: Exists
          #values:
          #- ssd

tolerations: []
#tolerations:
#  - key: "node-role.kubernetes.io/worker"
#    operator: "Exists"
#    #value: "value"
#    effect: "NoSchedule"

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       role: sentinel
  #       app: redis-sentinel

serviceAccountName: "default"

TLS:
  ca: ca.crt
  cert: tls.crt
  key: tls.key
  # Any corev1.SecretVolumeSource field is accepted here and passed to the
  # spec as-is.
  secret:
    secretName: ""
    defaultMode: 0440

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 1
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 1
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

env: []
  # - name: VAR_NAME
  #   value: "value1"

#podManagementPolicy: OrderedReady
